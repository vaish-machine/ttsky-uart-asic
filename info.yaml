project:
  title: "UART Transmitter and Receiver"
  author: "vaish-machine"
  discord: ""
  description: "8-bit UART TX and RX with framing-error detection"
  language: "Verilog"
  clock_hz: 10000000
  tiles: "3x2"
  top_module: "tt_um_vaish_uart"
  source_files:
    - "tt_um_vaish_uart.v"
    - "uart_core.sv"
    - "uart_tx.sv"
    - "uart_rx.sv"

pinout:
  ui[0]: "TX_DATA_0"
  ui[1]: "TX_DATA_1"
  ui[2]: "TX_DATA_2"
  ui[3]: "TX_DATA_3"
  ui[4]: "TX_DATA_4"
  ui[5]: "TX_DATA_5"
  ui[6]: "TX_DATA_6"
  ui[7]: "TX_DATA_7"
  uo[0]: "RX_DATA_0"
  uo[1]: "RX_DATA_1"
  uo[2]: "RX_DATA_2"
  uo[3]: "RX_DATA_3"
  uo[4]: "RX_DATA_4"
  uo[5]: "RX_DATA_5"
  uo[6]: "RX_DATA_6"
  uo[7]: "RX_DATA_7"
  uio[0]: "TX_VALID"
  uio[1]: "RX_SERIAL"
  uio[2]: "TX_READY"
  uio[3]: "TX_SERIAL"
  uio[4]: "RX_VALID"
  uio[5]: "RX_FRAMING_ERROR"
  uio[6]: ""
  uio[7]: ""

yaml_version: 6
